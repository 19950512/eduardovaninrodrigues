name = "eduardo-vanin-agente"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# Roda diariamente às 12:00 UTC (09:00 no horário de Brasília).
# A cadência real (a cada N dias, default 3) é controlada no código via KV,
# então o cron pode ser diário sem gerar posts em excesso.
[triggers]
crons = ["0 12 * * *"]

# Estado do agente (última execução, dedup de notícias, rascunhos pendentes).
# Crie com:  npx wrangler kv namespace create AGENTE_KV
# e cole o id retornado abaixo.
[[kv_namespaces]]
binding = "AGENTE_KV"
id = "239b00a66a414f21b98c5bd126243eca"

# Observação: os segredos (ANTHROPIC_API_KEY, GITHUB_TOKEN, WHATSAPP_TOKEN,
# WHATSAPP_PHONE_ID, WHATSAPP_DESTINO, WHATSAPP_VERIFY_TOKEN, META_APP_SECRET,
# APPROVAL_SECRET) NÃO vão aqui — use `npx wrangler secret put <NOME>`.
# Veja README.md.
